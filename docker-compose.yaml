# A Docker Compose must always start with the version tag.
# We use '3' because it's the last version.
version: "3"

services:
  # The name of our service is "database"
  # but you can use the name of your choice.
  # Note: This may change the commands you are going to use a little bit.
  database:
    # Official Postgres image from DockerHub (we use the last version)
    image: "postgres:16-alpine"
    # you are connecting to your database.
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: dev # The PostgreSQL user (useful to connect to the database)
      POSTGRES_PASSWORD: dev # The PostgreSQL password (useful to connect to the database)
      POSTGRES_DB: nebula # The PostgreSQL default database (automatically created at first launch)
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data/
